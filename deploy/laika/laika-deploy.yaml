apiVersion: apps/v1
kind: Deployment
metadata:
  name: laika-deploy
  labels:
    app: laika
spec:
  replicas: 2
  selector:
    matchLabels:
      app: laika
  template:
    metadata:
      labels:
        app: laika
    spec:
      imagePullSecrets:
      - name: gitlab-registry-credentials
      containers:
      - name: laika
        image: "{{ CI_REGISTRY_IMAGE }}/laika:latest"
        ports:
        - containerPort: 8080
        env:
        - name: API_BASE_URL
          value: "http://rest-api-service"
        resources:
          requests:
            cpu: "125m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
