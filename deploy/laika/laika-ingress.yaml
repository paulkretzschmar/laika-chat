apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: laika-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt"
    acme.cert-manager.io/http01-edit-in-place: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: "laika-{{ CI_PROJECT_ID }}.edu.k8s.th-luebeck.dev"
    http:
      paths:
        - pathType: Prefix
          path: /
          backend:
            service:
              name: laika-service
              port:
                number: 80
  tls:
  - secretName: laika-ingress-cert
    hosts: ["laika-{{ CI_PROJECT_ID }}.edu.k8s.th-luebeck.dev"]
