apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest-api-deploy
  labels:
    app: rest-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rest-api
  template:
    metadata:
      labels:
        app: rest-api
    spec:
      imagePullSecrets:
      - name: gitlab-registry-credentials
      containers:
      - name: rest-api
        image: "{{ CI_REGISTRY_IMAGE }}/rest-api:latest"
        ports:
        - containerPort: 8000
        env:
        - name: MONGO_URI
          value: "mongodb://mongo-db-service:27017"
        envFrom:
          - secretRef:
              name: rest-api-secret
        resources:
          requests:
            cpu: "125m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
